name: Build ShotsFX Channel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      AAX_SDK_URL: ${{ secrets.AAX_SDK_URL }}

    steps:
      - uses: actions/checkout@v4

      # Optional AAX (Pro Tools). Only runs if you add the secret AAX_SDK_URL.
      - name: Fetch AAX SDK (optional)
        if: ${{ env.AAX_SDK_URL != '' }}
        shell: bash
        run: |
          curl -L "$AAX_SDK_URL" -o aax.zip
          unzip -q aax.zip -d aax-sdk
          echo "AAX_SDK_PATH=$(pwd)/aax-sdk/$(ls aax-sdk | head -n1)" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ -n "$AAX_SDK_PATH" ]; then EXTRA="-DAAX_SDK_PATH=$AAX_SDK_PATH"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugins
        shell: bash
        run: |
          mkdir out
          find build -name "*.vst3"       -maxdepth 8 -exec cp -R {} out/ \; 2>/dev/null || true
          find build -name "*.component"  -maxdepth 8 -exec cp -R {} out/ \; 2>/dev/null || true
          find build -name "*.aaxplugin"  -maxdepth 8 -exec cp -R {} out/ \; 2>/dev/null || true
          # Standalone (handy for quick testing)
          find build -name "*Standalone*" -maxdepth 8 -type f \( -name "*.exe" -o -name "*.app" -o -perm -111 \) -exec cp -R {} out/ \; 2>/dev/null || true
          ls -la out || true

      - uses: actions/upload-artifact@v4
        with:
          name: ShotsFX-Channel-${{ matrix.os }}
          path: out
